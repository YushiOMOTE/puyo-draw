<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111827" />
    <meta
      name="description"
      content="スマホで遊べるぷよぷよ連鎖シミュレーター"
    />
    <title>ぷよ連鎖シミュレーター</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <div class="play-area">
        <section class="board-card" aria-label="ぷよぷよ盤面">
          <div class="board-wrap">
            <div
              id="board"
              class="board"
              role="grid"
              aria-label="6列14段の盤面"
            ></div>
          </div>
          <div
            id="flickMenu"
            class="flick-menu"
            hidden
            aria-label="フリックで色を選択"
          ></div>
          <p id="status" class="status" role="status"></p>
        </section>

        <section class="toolbar" aria-label="操作">
          <div
            class="chain-badge"
            aria-label="連鎖数"
            aria-live="polite"
          >
            <span id="chainNumber">0</span>
            <small>れんさ</small>
          </div>

          <div class="sidebar-actions" aria-label="履歴操作">
            <button
              id="undo"
              class="secondary-btn sidebar-btn"
              aria-label="戻す"
              title="戻す"
              disabled
            >
              <svg
                class="history-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path d="M9 7h7a5 5 0 0 1 0 10h-3" />
                <path d="m9 7 4-4M9 7l4 4" />
              </svg>
            </button>
            <button
              id="redo"
              class="secondary-btn sidebar-btn"
              aria-label="進む"
              title="進む"
              disabled
            >
              <svg
                class="history-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path d="M15 7H8a5 5 0 0 0 0 10h3" />
                <path d="m15 7-4-4M15 7l-4 4" />
              </svg>
            </button>
          </div>

          <div class="tool-row palette" role="group" aria-label="ぷよの色">
            <button
              class="color-btn active"
              data-tool="red"
              aria-label="赤ぷよ"
              aria-pressed="true"
            ><i></i></button>
            <button
              class="color-btn"
              data-tool="green"
              aria-label="緑ぷよ"
              aria-pressed="false"
            ><i></i></button>
            <button
              class="color-btn"
              data-tool="blue"
              aria-label="青ぷよ"
              aria-pressed="false"
            ><i></i></button>
            <button
              class="color-btn"
              data-tool="yellow"
              aria-label="黄ぷよ"
              aria-pressed="false"
            ><i></i></button>
            <button
              class="color-btn"
              data-tool="purple"
              aria-label="紫ぷよ"
              aria-pressed="false"
            ><i></i></button>
            <button
              class="tool-btn erase"
              data-tool="erase"
              aria-label="消しゴム"
            >⌫</button>
          </div>

          <div class="tool-row action-row">
            <button id="clear" class="secondary-btn">
              ✕ <span>クリア</span>
            </button>
          </div>

          <div class="simulation-row">
            <button
              id="simulate"
              class="primary-btn"
              aria-label="連鎖シミュレーション"
              title="連鎖シミュレーション"
            >
              ▶
            </button>
            <button
              id="reset"
              class="secondary-btn reset-btn"
              aria-label="リセット"
              title="リセット"
            >
              ↺
            </button>
          </div>
        </section>
      </div>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
