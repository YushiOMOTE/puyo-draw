<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111827" />
    <meta
      name="description"
      content="A touch-friendly Puyo Puyo chain simulator"
    />
    <title>Puyo Chain Simulator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <div class="play-area">
        <section class="board-card" aria-label="Puyo Puyo board">
          <div class="board-wrap">
            <div
              id="board"
              class="board"
              role="grid"
              aria-label="Six-column, fourteen-row board"
            ></div>
          </div>
          <div
            id="flickMenu"
            class="flick-menu"
            hidden
            aria-label="Flick to select a color"
          ></div>
          <p id="status" class="status" role="status"></p>
        </section>

        <section class="toolbar" aria-label="Controls">
          <div
            class="chain-badge"
            aria-label="Chain count"
            aria-live="polite"
          >
            <span id="chainNumber">0</span>
            <small>chains</small>
          </div>

          <div class="sidebar-actions" aria-label="History controls">
            <button
              id="undo"
              class="secondary-btn sidebar-btn"
              aria-label="Undo"
              title="Undo"
              disabled
            >
              <svg
                class="history-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path d="M9 7h7a5 5 0 0 1 0 10h-3" />
                <path d="m9 7 4-4M9 7l4 4" />
              </svg>
            </button>
            <button
              id="redo"
              class="secondary-btn sidebar-btn"
              aria-label="Redo"
              title="Redo"
              disabled
            >
              <svg
                class="history-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path d="M15 7H8a5 5 0 0 0 0 10h3" />
                <path d="m15 7-4-4M15 7l-4 4" />
              </svg>
            </button>
          </div>

          <div class="tool-row palette" role="group" aria-label="Puyo colors">
            <button
              class="color-btn active"
              data-tool="red"
              aria-label="Red puyo"
              aria-pressed="true"
            ><i></i></button>
            <button
              class="color-btn"
              data-tool="green"
              aria-label="Green puyo"
              aria-pressed="false"
            ><i></i></button>
            <button
              class="color-btn"
              data-tool="blue"
              aria-label="Blue puyo"
              aria-pressed="false"
            ><i></i></button>
            <button
              class="color-btn"
              data-tool="yellow"
              aria-label="Yellow puyo"
              aria-pressed="false"
            ><i></i></button>
            <button
              class="color-btn"
              data-tool="purple"
              aria-label="Purple puyo"
              aria-pressed="false"
            ><i></i></button>
            <button
              class="tool-btn erase"
              data-tool="erase"
              aria-label="Eraser"
            >⌫</button>
          </div>

          <div class="tool-row action-row">
            <button id="clear" class="secondary-btn">
              ✕ <span>Clear</span>
            </button>
          </div>

          <div class="simulation-row">
            <button
              id="simulate"
              class="primary-btn"
              aria-label="Simulate chains"
              title="Simulate chains"
            >
              ▶
            </button>
            <button
              id="reset"
              class="secondary-btn reset-btn"
              aria-label="Reset"
              title="Reset"
            >
              ↺
            </button>
          </div>
        </section>
      </div>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
